name: Flash arb scan

# READ-ONLY: this scheduled workflow always runs with DRY_RUN=true and deliberately has no access
# to PRIVATE_KEY or CONTRACT_ADDRESS. It only scans and logs opportunities. Live execution is
# intentionally kept out of this workflow and will be handled by a separate, explicitly configured
# workflow that exposes wallet secrets only to that job.

on:
  # Runs on a schedule (UTC, GitHub's cron). Every 10 minutes is a reasonable free-tier default -
  # tighten it once you've confirmed the bot behaves the way you expect. GitHub Actions schedules
  # can lag a few minutes under load, so treat this as "roughly every 10 minutes", not exact.
  schedule:
    - cron: "*/5 * * * *"
  # Lets you trigger a run by hand from the Actions tab (works fine from mobile Safari/GitHub app).
  workflow_dispatch: {}

# Skip overlapping runs instead of piling them up if one run is slow.
concurrency:
  group: flash-arb-scan
  cancel-in-progress: true

jobs:
  scan:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci --ignore-scripts

      - name: Run scanner
        env:
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
          DRY_RUN: "true"
          AAVE_FLASH_LOAN_PREMIUM_BPS: ${{ secrets.AAVE_FLASH_LOAN_PREMIUM_BPS || '5' }}
          MIN_PROFIT_USD: ${{ secrets.MIN_PROFIT_USD || '5' }}
          MIN_PROFIT_BUFFER_BPS: ${{ secrets.MIN_PROFIT_BUFFER_BPS || '5000' }}
          SLIPPAGE_BPS: ${{ secrets.SLIPPAGE_BPS || '50' }}
          GAS_LIMIT_ESTIMATE: ${{ secrets.GAS_LIMIT_ESTIMATE || '700000' }}
          MAX_GAS_LIMIT: ${{ secrets.MAX_GAS_LIMIT || '1000000' }}
          GAS_PRICE_BUFFER_PCT: ${{ secrets.GAS_PRICE_BUFFER_PCT || '20' }}
          ETH_USD_ROUTE_JSON: ${{ secrets.ETH_USD_ROUTE_JSON }}
          # mainnet only - do not reuse on Sepolia
          PAIRS_CONFIG_JSON: ${{ secrets.PAIRS_CONFIG_JSON }}
        run: npm run scan

      # Runners are ephemeral; upload the JSONL so scan history survives the job and can be
      # downloaded (one artifact per run) for the 2-4 week measurement.
      - name: Upload scan history
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scan-log
          path: logs/scans.jsonl
          if-no-files-found: ignore
          retention-days: 90

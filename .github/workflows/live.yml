name: Live execution (manual)

# Manual-only by design: this workflow has no schedule/cron trigger. It is the only workflow that
# receives PRIVATE_KEY, and it verifies that CONTRACT_ADDRESS points at the current FlashArbExecutor
# source before running the bot with DRY_RUN=false.

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Network to trade on"
        required: true
        default: "arbitrumSepolia"
        type: choice
        options:
          - arbitrumSepolia
          - arbitrum
      confirm:
        description: 'Type EXECUTE to confirm real-money trading'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: flash-arb-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'EXECUTE' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Validate live secrets
        env:
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
          ARBITRUM_SEPOLIA_RPC_URL: ${{ secrets.ARBITRUM_SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          CONTRACT_ADDRESS: ${{ secrets.CONTRACT_ADDRESS }}
          CONTRACT_ADDRESS_SEPOLIA: ${{ secrets.CONTRACT_ADDRESS_SEPOLIA }}
        run: |
          if [ "${{ inputs.network }}" = "arbitrum" ]; then
            rpc_var="ARBITRUM_RPC_URL"
            contract_var="CONTRACT_ADDRESS"
          else
            rpc_var="ARBITRUM_SEPOLIA_RPC_URL"
            contract_var="CONTRACT_ADDRESS_SEPOLIA"
          fi
          missing=0
          for name in "$rpc_var" PRIVATE_KEY "$contract_var"; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty. Add it in Settings > Secrets and variables > Actions > Secrets (repository secrets), then re-run."
              missing=1
            fi
          done
          exit "$missing"

      - name: Verify deployed contract is the current version
        env:
          ARBITRUM_RPC_URL: ${{ inputs.network == 'arbitrum' && secrets.ARBITRUM_RPC_URL || secrets.ARBITRUM_SEPOLIA_RPC_URL }}
          ARBITRUM_SEPOLIA_RPC_URL: ${{ secrets.ARBITRUM_SEPOLIA_RPC_URL }}
          CONTRACT_ADDRESS: ${{ inputs.network == 'arbitrum' && secrets.CONTRACT_ADDRESS || secrets.CONTRACT_ADDRESS_SEPOLIA }}
        run: npx hardhat run scripts/deploy-live.js --network ${{ inputs.network }}

      - name: Run live bot
        env:
          ARBITRUM_RPC_URL: ${{ inputs.network == 'arbitrum' && secrets.ARBITRUM_RPC_URL || secrets.ARBITRUM_SEPOLIA_RPC_URL }}
          DRY_RUN: "false"
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          CONTRACT_ADDRESS: ${{ inputs.network == 'arbitrum' && secrets.CONTRACT_ADDRESS || secrets.CONTRACT_ADDRESS_SEPOLIA }}
          AAVE_FLASH_LOAN_PREMIUM_BPS: ${{ secrets.AAVE_FLASH_LOAN_PREMIUM_BPS || '5' }}
          MIN_PROFIT_USD: ${{ secrets.MIN_PROFIT_USD || '5' }}
          MIN_PROFIT_BUFFER_BPS: ${{ secrets.MIN_PROFIT_BUFFER_BPS || '5000' }}
          SLIPPAGE_BPS: ${{ secrets.SLIPPAGE_BPS || '50' }}
          GAS_LIMIT_ESTIMATE: ${{ secrets.GAS_LIMIT_ESTIMATE || '700000' }}
          MAX_GAS_LIMIT: ${{ secrets.MAX_GAS_LIMIT || '1000000' }}
          GAS_PRICE_BUFFER_PCT: ${{ secrets.GAS_PRICE_BUFFER_PCT || '20' }}
          ETH_USD_ROUTE_JSON: ${{ secrets.ETH_USD_ROUTE_JSON }}
          PAIRS_CONFIG_JSON: ${{ secrets.PAIRS_CONFIG_JSON }}
        run: npm run scan

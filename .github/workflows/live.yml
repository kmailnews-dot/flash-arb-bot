name: Live execution (manual)

# Manual-only by design: this workflow has no schedule/cron trigger. It is the only workflow that
# receives PRIVATE_KEY, and it verifies that CONTRACT_ADDRESS points at the current FlashArbExecutor
# source before running the bot with DRY_RUN=false.

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Network to trade on"
        required: true
        default: "arbitrumSepolia"
        type: choice
        options:
          - arbitrumSepolia
          - arbitrum
      confirm:
        description: 'Type EXECUTE to confirm real-money trading'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: flash-arb-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'EXECUTE' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci --ignore-scripts

      - name: Validate live secrets
        env:
          TARGET_NETWORK: ${{ inputs.network }}
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
          ARBITRUM_SEPOLIA_RPC_URL: ${{ secrets.ARBITRUM_SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          CONTRACT_ADDRESS: ${{ secrets.CONTRACT_ADDRESS }}
          CONTRACT_ADDRESS_SEPOLIA: ${{ secrets.CONTRACT_ADDRESS_SEPOLIA }}
        run: |
          if [ "$TARGET_NETWORK" = "arbitrum" ]; then
            rpc_var="ARBITRUM_RPC_URL"
            contract_var="CONTRACT_ADDRESS"
          else
            rpc_var="ARBITRUM_SEPOLIA_RPC_URL"
            contract_var="CONTRACT_ADDRESS_SEPOLIA"
          fi
          missing=0
          for name in "$rpc_var" PRIVATE_KEY "$contract_var"; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty. Add it in Settings > Secrets and variables > Actions > Secrets (repository secrets), then re-run."
              missing=1
            fi
          done
          exit "$missing"

      - name: Validate EXPECTED_OWNER variable
        env:
          EXPECTED_OWNER: ${{ vars.EXPECTED_OWNER }}
        run: |
          if [ -z "$EXPECTED_OWNER" ]; then
            echo "::error::EXPECTED_OWNER is empty. Add it in Settings > Secrets and variables > Actions > Variables (repository variables), then re-run."
            exit 1
          fi

      - name: Verify deployed contract is the current version
        env:
          TARGET_NETWORK: ${{ inputs.network }}
          ARBITRUM_RPC_URL: ${{ inputs.network == 'arbitrum' && secrets.ARBITRUM_RPC_URL || secrets.ARBITRUM_SEPOLIA_RPC_URL }}
          ARBITRUM_SEPOLIA_RPC_URL: ${{ secrets.ARBITRUM_SEPOLIA_RPC_URL }}
          CONTRACT_ADDRESS: ${{ inputs.network == 'arbitrum' && secrets.CONTRACT_ADDRESS || secrets.CONTRACT_ADDRESS_SEPOLIA }}
          EXPECTED_OWNER: ${{ vars.EXPECTED_OWNER }}
        run: npx hardhat run scripts/deploy-live.js --network "$TARGET_NETWORK"

      # GitHub-hosted runners are ephemeral. Restore the previous run's guard state so the daily
      # gas cap and circuit-breaker cooldown survive manual triggers, then save the updated state.
      - name: Restore loss-guard state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            logs/gas_spent.json
            logs/circuit_breaker.json
          key: flash-arb-guard-state-${{ inputs.network }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            flash-arb-guard-state-${{ inputs.network }}-

      - name: Run live bot
        env:
          ARBITRUM_RPC_URL: ${{ inputs.network == 'arbitrum' && secrets.ARBITRUM_RPC_URL || secrets.ARBITRUM_SEPOLIA_RPC_URL }}
          DRY_RUN: "false"
          # Must match the selected network; the bot refuses to send on a chainId mismatch.
          EXPECTED_CHAIN_ID: ${{ inputs.network == 'arbitrum' && '42161' || '421614' }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          CONTRACT_ADDRESS: ${{ inputs.network == 'arbitrum' && secrets.CONTRACT_ADDRESS || secrets.CONTRACT_ADDRESS_SEPOLIA }}
          AAVE_FLASH_LOAN_PREMIUM_BPS: ${{ secrets.AAVE_FLASH_LOAN_PREMIUM_BPS || '5' }}
          MIN_PROFIT_USD: ${{ secrets.MIN_PROFIT_USD || '5' }}
          MIN_PROFIT_BUFFER_BPS: ${{ secrets.MIN_PROFIT_BUFFER_BPS || '5000' }}
          SLIPPAGE_BPS: ${{ secrets.SLIPPAGE_BPS || '50' }}
          GAS_LIMIT_ESTIMATE: ${{ secrets.GAS_LIMIT_ESTIMATE || '700000' }}
          MAX_GAS_LIMIT: ${{ secrets.MAX_GAS_LIMIT || '1000000' }}
          GAS_PRICE_BUFFER_PCT: ${{ secrets.GAS_PRICE_BUFFER_PCT || '20' }}
          MAX_WALLET_BALANCE_ETH: ${{ secrets.MAX_WALLET_BALANCE_ETH || '0.1' }}
          MAX_DAILY_GAS_ETH: ${{ secrets.MAX_DAILY_GAS_ETH || '0.01' }}
          MAX_CONSECUTIVE_FAILURES: ${{ secrets.MAX_CONSECUTIVE_FAILURES || '5' }}
          CIRCUIT_BREAKER_COOLDOWN_MINUTES: ${{ secrets.CIRCUIT_BREAKER_COOLDOWN_MINUTES || '60' }}
          ETH_USD_ROUTE_JSON: ${{ secrets.ETH_USD_ROUTE_JSON }}
          PAIRS_CONFIG_JSON: ${{ secrets.PAIRS_CONFIG_JSON }}
        run: npm run scan

      - name: Save loss-guard state
        if: always() && hashFiles('logs/gas_spent.json', 'logs/circuit_breaker.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            logs/gas_spent.json
            logs/circuit_breaker.json
          key: flash-arb-guard-state-${{ inputs.network }}-${{ github.run_id }}-${{ github.run_attempt }}
